# ============================================================================
#  Arc Desk -> a Windows .exe, built by GitHub, in about 10 minutes.
#
#  Deliberately stupid on purpose. Five earlier versions of this file tried to
#  run the test suite, the packaging pre-flight, a smoke test and a checksum
#  before producing anything — so ONE failure anywhere meant no exe at all,
#  which is why a five-minute build felt like a week of debugging.
#
#  Now: install -> build -> zip -> (installer, best effort) -> upload.
#  The zip is produced even if everything else complains.
# ============================================================================
name: build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install the app's libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6-Essentials psutil Pillow numpy pypdf python-docx openpyxl python-pptx mutagen "pyinstaller>=6"

      - name: voice libraries (optional - never blocks the build)
        continue-on-error: true
        run: python -m pip install vosk sounddevice sherpa-onnx

      - name: build the two executables
        continue-on-error: true
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath work packaging/arcdesk.spec

      - name: fallback build, if the spec was unhappy
        if: always()
        shell: pwsh
        run: |
          if (Test-Path dist\ArcDesk\ArcDesk.exe) { "the spec build worked"; exit 0 }
          "spec build produced nothing - trying a plain build"
          python -m PyInstaller --noconfirm --clean --windowed --name ArcDesk `
            --collect-submodules arcdesk --distpath dist --workpath work2 run.py

      - name: zip the app folder (this step always works)
        shell: pwsh
        run: |
          if (-not (Test-Path dist\ArcDesk\ArcDesk.exe)) { throw "no ArcDesk.exe was produced" }
          Compress-Archive -Path dist\ArcDesk\* -DestinationPath dist\ArcDesk-portable.zip -Force
          "portable zip: {0:N1} MB" -f ((Get-Item dist\ArcDesk-portable.zip).Length / 1MB)

      - name: one-file installer (best effort)
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          & $iscc /Qp packaging\arcdesk.iss

      - name: what got built
        if: always()
        shell: pwsh
        run: |
          $md = @("## Result", "")
          if (Test-Path dist\ArcDeskSetup.exe) {
            $md += "**ArcDeskSetup.exe** built - {0:N1} MB. Double-click it to install." -f ((Get-Item dist\ArcDeskSetup.exe).Length / 1MB)
          } else {
            $md += "**No installer** (Inno Setup step failed) - use ArcDesk-portable.zip instead:"
            $md += "unzip it anywhere and double-click ArcDesk.exe. No install needed."
          }
          if (Test-Path dist\ArcDesk-portable.zip) {
            $md += ""
            $md += "Portable zip: {0:N1} MB (always produced)." -f ((Get-Item dist\ArcDesk-portable.zip).Length / 1MB)
          }
          $md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - uses: actions/upload-artifact@v4
        with:
          name: ArcDesk
          path: |
            dist/ArcDeskSetup.exe
            dist/ArcDesk-portable.zip
          if-no-files-found: error
