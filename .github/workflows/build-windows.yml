# Build the real Windows installer on a Windows runner — no Windows PC needed.
#
#   GitHub -> Actions -> "build windows installer" -> Run workflow
#   -> download the artifact "ArcDeskSetup" and double-click it.
#
# Everything happens on GitHub's machine: Python, the voice libraries, ffmpeg/node,
# PyInstaller and Inno Setup. Nothing is downloaded on the user's PC except the two
# speech models, which the installer offers visibly at the end.
name: build windows installer

on:
  # Pushing the repo is enough — no clicking through menus is required for a first build.
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: install python packages
        shell: pwsh
        run: |
          # One package at a time, and SAY which file failed. A bare
          # "pip install -r requirements.txt" that dies tells you nothing about which of
          # the ten packages it died on, which is exactly what run #3 did.
          python -m pip install --upgrade pip setuptools wheel
          foreach ($f in @("requirements.txt", "requirements-voice.txt")) {
            Write-Host "--- installing $f"
            python -m pip install --prefer-binary -r $f
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error file=$f::pip could not install $f"
              throw "pip failed on $f - the line above names the package"
            }
          }
          python -m pip install --prefer-binary "pyinstaller>=6"
          if ($LASTEXITCODE -ne 0) { throw "pip failed on pyinstaller" }

      - name: prove the right packages are installed
        shell: pwsh
        run: |
          # This is the step that would have caught the missing-Pillow build in one
          # second instead of twelve failing tests.
          python -c "import PySide6, psutil, PIL, numpy, pypdf, docx, openpyxl, pptx, mutagen; print('app deps ok')"
          if ($LASTEXITCODE -ne 0) { throw "the app's own imports are not installable" }
          python -c "import vosk, sherpa_onnx; print('voice libs ok')"
          if ($LASTEXITCODE -ne 0) { throw "voice libraries missing (wake word / voice lock)" }
          python -m pip list

      - name: prove the app works before packaging it
        # Tests do NOT block the installer any more. They used to: one Windows-only test
        # failure meant no exe at all, which made a five-minute build feel like a week of
        # debugging. Now the installer is always built, and the failures are shouted
        # about on the run page and in the artifact. "prove the right packages are
        # installed" above still blocks, because a missing library is a broken product.
        continue-on-error: true
        shell: pwsh
        run: |
          # Tee so the full test output survives whether this step passes or fails.
          python tests/run_all.py 2>&1 | Tee-Object -FilePath tests.log
          if ($LASTEXITCODE -ne 0) { throw "the test suite failed - see tests.log" }

      - name: build the two exes + the installer
        run: packaging\build_all.bat

      - name: smoke-test the frozen exe
        shell: pwsh
        run: |
          # A windowed exe (console=False) does NOT set $LASTEXITCODE when started
          # directly — the check below would read a stale value and fail a good build.
          # Start-Process -Wait -PassThru is the way to get a real exit code.
          $exe = ".\dist\ArcDesk\ArcDesk.exe"
          if (-not (Test-Path $exe)) { throw "build produced no ArcDesk.exe" }
          if (-not (Test-Path ".\dist\ArcDesk\ArcDeskVoice.exe")) {
            throw "ArcDeskVoice.exe missing next to ArcDesk.exe"
          }
          $p = Start-Process -FilePath $exe -ArgumentList "--version" -Wait -PassThru -NoNewWindow
          "version exit: $($p.ExitCode)"
          $p = Start-Process -FilePath $exe -ArgumentList "--doctor" -Wait -PassThru -NoNewWindow
          "doctor  exit: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "--doctor failed inside the frozen build" }

      - name: what was built, and its checksum
        run: |
          Get-ChildItem dist\ArcDeskSetup.exe | Format-List Name, Length, LastWriteTime
          $h = (Get-FileHash dist\ArcDeskSetup.exe -Algorithm SHA256).Hash
          "SHA-256  $h  ArcDeskSetup.exe" | Tee-Object -FilePath dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: keep every log when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-log
          # tests.log is the whole point: on a red run it can be read from the run page
          # without hunting through the live log, and pasted into a message.
          path: |
            tests.log
            .failures/
            packaging/build_info.txt
            dist/**/*.log
          if-no-files-found: ignore

      - name: the last 40 lines, on the run page itself
        if: failure()
        shell: pwsh
        run: |
          $note = @(
            "## Build failed",
            "",
            "Nothing was installed on any PC. A failed build changes nothing.",
            "",
            "Download the **failure-log** artifact below for the full output.",
            ""
          )
          # Each failing test writes its own last lines into .failures/<name>.txt, so the
          # run page shows WHY, not just the name of the test that failed.
          if (Test-Path .failures) {
            Get-ChildItem .failures\*.txt | ForEach-Object {
              $note += "**$($_.Name)**"
              $note += "``````"
              $note += (Get-Content $_.FullName -Tail 60)
              $note += "``````"
            }
          } elseif (Test-Path tests.log) {
            $note += "``````"
            $note += (Get-Content tests.log -Tail 40)
            $note += "``````"
          }
          $note | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: the verdict, in one place
        if: always()
        shell: pwsh
        run: |
          $lines = @("## Result", "")
          if (Test-Path dist\ArcDeskSetup.exe) {
            $mb = [math]::Round((Get-Item dist\ArcDeskSetup.exe).Length / 1MB, 1)
            $lines += "**The installer was built: $mb MB.** Download it from *Artifacts* below."
          } else {
            $lines += "**No installer this time** - read the red step above."
          }
          if (Test-Path tests.log) {
            $pass = (Select-String -Path tests.log -Pattern "passed in" | Select-Object -Last 1).Line
            if ($pass) { $lines += ""; $lines += "Tests: ``$($pass.Trim())``" }
          }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - uses: actions/upload-artifact@v4
        with:
          name: ArcDeskSetup
          path: |
            dist/ArcDeskSetup.exe
            dist/SHA256SUMS.txt
            packaging/build_info.txt
          if-no-files-found: error
